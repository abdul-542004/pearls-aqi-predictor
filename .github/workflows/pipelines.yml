name: AQI Pipelines

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * *" # Disabled automatic schedule to save GitHub Actions minutes. Uncomment when ready for production.

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m aqi_predictor.pipelines.feature_pipeline

  training-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m aqi_predictor.pipelines.training_pipeline

