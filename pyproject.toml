[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi-predictor"
version = "0.1.0"
description = "Serverless AQI forecasting pipeline and dashboard scaffold."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
training = [
    "hopsworks>=5.0.0",
    "lime>=0.2.0",
    "matplotlib>=3.8.0",
    "openmeteo-requests>=1.2.0",
    "plotly>=5.18.0",
    "pyarrow>=14.0.0",
    "seaborn>=0.13.0",
    "shap>=0.44.0",
    "torch>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.fastapi]
entrypoint = "aqi_predictor.app.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
